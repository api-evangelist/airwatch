name: AirWatch
description: 'AirWatch was an enterprise mobility management (EMM) and mobile device management (MDM) company founded in 2003 in Atlanta, Georgia and backed by Accel. It provided cloud-based device, application, content, and email management for enterprise mobile fleets. VMware acquired AirWatch in February 2014 for roughly USD 1.5 billion, folding it into the VMware Workspace ONE Unified Endpoint Management (UEM) platform, and the brand was fully retired. In 2024 VMware End-User Computing (including Workspace ONE) was divested to Omnissa. As an independent brand AirWatch no longer operates a developer portal or public API: airwatch.com now redirects to the Omnissa Workspace ONE UEM product page, and the historical AirWatch REST API lives on as the per-tenant Workspace ONE UEM REST API served from customer *.awmdm.com consoles. This profile is retained as an acquired-company lead in the API Evangelist network.'
